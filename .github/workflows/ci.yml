name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dejoiy
          POSTGRES_PASSWORD: dejoiy_secret
          POSTGRES_DB: dejoiy_codeagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dejoiy:dejoiy_secret@localhost:5432/dejoiy_codeagent
      JWT_SECRET: ci-test-secret
      WORKSPACE_ROOT: /tmp/workspaces

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm lint
